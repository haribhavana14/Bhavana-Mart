<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bhavana-Mart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3e8ff;
            color: #2e1065;
        }

        header {
            background: linear-gradient(135deg, #6d28d9, #9333ea);
            color: white;
            padding: 28px 8%;
            box-shadow: 0 4px 14px rgba(76, 29, 149, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            margin: 7px 0 0;
            font-size: 15px;
            opacity: 0.9;
        }

        main {
            width: 84%;
            max-width: 1100px;
            margin: 32px auto;
        }

        .status {
            background: white;
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 28px;
            border-left: 6px solid #7c3aed;
            box-shadow: 0 4px 14px rgba(76, 29, 149, 0.10);
        }

        #health {
            color: #7c3aed;
            font-weight: bold;
        }

        h2 {
            color: #581c87;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            border-top: 5px solid #8b5cf6;
            box-shadow: 0 5px 16px rgba(76, 29, 149, 0.12);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(76, 29, 149, 0.18);
        }

        .card h3 {
            margin-top: 0;
            color: #581c87;
            font-size: 21px;
        }

        .price {
            margin-top: 12px;
            font-size: 23px;
            font-weight: bold;
            color: #7c3aed;
        }

        .stock {
            margin-top: 9px;
            color: #6b21a8;
            font-weight: 600;
        }

        .add-box {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-top: 32px;
            box-shadow: 0 5px 16px rgba(76, 29, 149, 0.12);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        input {
            padding: 13px;
            border: 2px solid #ddd6fe;
            border-radius: 9px;
            width: 100%;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px #ede9fe;
        }

        button {
            margin-top: 16px;
            padding: 13px 24px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 14px;
            color: #6b21a8;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 18px;
            color: #7e22ce;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>💜 Bhavana-Mart</h1>
    <p>Simple C++ / Drogon E-Commerce Backend</p>
</header>

<main>

    <div class="status">
        <strong>Backend Status:</strong>
        <span id="health">Checking...</span>
    </div>

    <h2>Products</h2>

    <div id="products" class="products"></div>

    <div class="add-box">
        <h2>Add Product</h2>

        <div class="form-grid">
            <input id="id" type="number" placeholder="Product ID">
            <input id="name" type="text" placeholder="Product Name">
            <input id="price" type="number" placeholder="Price">
            <input id="stock" type="number" placeholder="Stock">
        </div>

        <button onclick="addProduct()">Add Product</button>

        <div id="message"></div>
    </div>

    <div class="footer">
        © 2026 Bhavana-Mart
    </div>

</main>

<script>
    async function checkHealth() {
        try {
            const response = await fetch("/api/v1/health");
            const data = await response.json();

            document.getElementById("health").textContent =
                data.status === "UP" ? " UP" : " DOWN";

        } catch (error) {
            document.getElementById("health").textContent = " DOWN";
        }
    }

    async function loadProducts() {
        const container = document.getElementById("products");

        container.textContent = "Loading products...";

        try {
            const response = await fetch("/api/v1/products");
            const products = await response.json();

            container.textContent = "";

            products.forEach(product => {
                const card = document.createElement("div");
                card.className = "card";

                const title = document.createElement("h3");
                title.textContent = product.name;

                const id = document.createElement("div");
                id.textContent = "ID: " + product.id;

                const price = document.createElement("div");
                price.className = "price";
                price.textContent = "₹" + product.price;

                const stock = document.createElement("div");
                stock.className = "stock";
                stock.textContent = "Stock: " + product.stock;

                card.appendChild(title);
                card.appendChild(id);
                card.appendChild(price);
                card.appendChild(stock);

                container.appendChild(card);
            });

        } catch (error) {
            container.textContent = "Unable to load products.";
        }
    }

    async function addProduct() {
        const id = Number(document.getElementById("id").value);
        const name = document.getElementById("name").value;
        const price = Number(document.getElementById("price").value);
        const stock = Number(document.getElementById("stock").value);

        const message = document.getElementById("message");

        if (!id || !name || price < 0 || stock < 0) {
            message.textContent = "Please enter valid product details.";
            return;
        }

        try {
            const response = await fetch("/api/v1/products", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    id: id,
                    name: name,
                    price: price,
                    stock: stock
                })
            });

            const data = await response.json();

            message.textContent =
                data.message || "Product added successfully.";

            document.getElementById("id").value = "";
            document.getElementById("name").value = "";
            document.getElementById("price").value = "";
            document.getElementById("stock").value = "";

            loadProducts();

        } catch (error) {
            message.textContent = "Failed to add product.";
        }
    }

    checkHealth();
    loadProducts();
</script>

</body>
</html>
